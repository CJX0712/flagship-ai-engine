name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: 可验证性自检 (Invariant Self-Test)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [16.x, 18.x, 20.x]
    steps:
      - uses: actions/checkout@v4
      - name: 使用 Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: 运行不变量自检
        run: node test/run.mjs
      - name: 校验全绿
        run: node test/run.mjs | grep -q "PASS " || (echo "自检未全绿" && exit 1)
